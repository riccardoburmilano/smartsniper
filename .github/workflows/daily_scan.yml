name: SmartSniper Daily Scan

on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate deals feed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          feed = json.loads(Path("demo/deals-feed.json").read_text(encoding="utf-8"))
          assert isinstance(feed.get("deals"), list), "deals must be a list"
          print(f"feed ok · deals={len(feed['deals'])} · generatedAt={feed.get('generatedAt')}")
          PY

      - name: Dry-run formatter
        run: python3 automation/telegram_bot.py --dry-run

      - name: Publish to Telegram
        if: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}
          EBAY_CAMPAIGN_ID: ${{ secrets.EBAY_CAMPAIGN_ID }}
        run: python3 automation/telegram_bot.py
