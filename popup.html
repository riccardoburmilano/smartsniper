<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartSniper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img src="icons/icon48.png" alt="" width="28" height="28" />
        <div>
          <h1>SmartSniper</h1>
          <p class="tagline">Risparmia. Snipa. Guadagna.</p>
        </div>
      </div>
      <button type="button" id="btn-check-now" class="btn btn-ghost" title="Controlla i prezzi ora">
        Controlla ora
      </button>
    </header>

    <nav class="tabs" role="tablist">
      <button type="button" class="tab is-active" data-tab="sniper" role="tab" aria-selected="true">
        Deal Sniper
      </button>
      <button type="button" class="tab" data-tab="savings" role="tab" aria-selected="false">
        Risparmi/Cashback
      </button>
    </nav>

    <main>
      <section id="panel-sniper" class="panel is-active" role="tabpanel">
        <form id="add-form" class="add-form" autocomplete="off">
          <label class="field">
            <span>URL prodotto</span>
            <input
              type="url"
              id="input-url"
              name="url"
              placeholder="https://… o file:///…/demo/product-demo.html"
              required
            />
          </label>
          <div class="field-row">
            <label class="field">
              <span>Soglia drop %</span>
              <input type="number" id="input-drop" name="drop" min="1" max="90" value="40" />
            </label>
            <label class="field">
              <span>Stima rivendita €</span>
              <input type="number" id="input-resale" name="resale" min="0" step="0.01" placeholder="opz." />
            </label>
          </div>
          <button type="submit" class="btn btn-primary">Aggiungi al monitor</button>
        </form>

        <div class="section-head">
          <h2>Articoli monitorati</h2>
          <span id="watch-count" class="badge">0</span>
        </div>
        <ul id="watch-list" class="list"></ul>
        <p id="watch-empty" class="empty">Nessun articolo. Incolla un URL prodotto o usa la demo in README.</p>
      </section>

      <section id="panel-savings" class="panel" role="tabpanel" hidden>
        <div class="section-head">
          <h2>Codici rilevati (sessione)</h2>
          <button type="button" id="btn-clear-deals" class="btn btn-ghost btn-sm">Svuota</button>
        </div>
        <ul id="deals-list" class="list"></ul>
        <p id="deals-empty" class="empty">
          Nessun codice ancora. Visita un checkout Amazon/eBay/Zalando o apri
          <code>demo/checkout-demo.html</code>.
        </p>
      </section>
    </main>

    <footer class="footer">
      <span id="status" class="status" aria-live="polite"></span>
      <span class="poll-hint">Poll ogni <span id="poll-minutes">15</span> min</span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
