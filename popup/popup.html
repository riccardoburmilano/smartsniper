<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartSniper Pro</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="header">
    <div>
      <p class="brand">SMARTSNIPER PRO</p>
      <h1>Dashboard</h1>
    </div>
    <button id="btn-sync" class="btn btn-primary" type="button">Controlla Ora</button>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="deals" type="button" role="tab" aria-selected="true">Deals</button>
    <button class="tab" data-tab="coupon" type="button" role="tab" aria-selected="false">Coupon</button>
  </nav>

  <main>
    <section id="panel-deals" class="panel active" role="tabpanel">
      <p id="deals-meta" class="meta">Sync in corso…</p>
      <div id="deals-list" class="list"></div>
      <div class="watch-box">
        <label for="watch-url">Aggiungi URL al monitor</label>
        <input id="watch-url" type="url" placeholder="https://…" />
        <div class="watch-grid">
          <input id="watch-buy" type="number" min="0" step="0.01" placeholder="Prezzo acquisto €" />
          <input id="watch-fmv" type="number" min="0" step="0.01" placeholder="FMV eBay/Vinted €" />
        </div>
        <button id="btn-watch" class="btn btn-ghost" type="button">Aggiungi al monitor</button>
      </div>
    </section>

    <section id="panel-coupon" class="panel" role="tabpanel" hidden>
      <p class="meta">Coupon mock per merchant corrente / demo</p>
      <label for="coupon-merchant">Merchant</label>
      <select id="coupon-merchant">
        <option value="demo">demo</option>
        <option value="amazon">amazon</option>
        <option value="ebay">ebay</option>
        <option value="zalando">zalando</option>
      </select>
      <div id="coupon-list" class="list"></div>
    </section>
  </main>

  <footer class="footer">
    <span id="sync-status">ROI netto alert ≥ 25%</span>
  </footer>

  <script src="../utils/affiliate.js"></script>
  <script src="../utils/api-client.js"></script>
  <script src="popup.js"></script>
</body>
</html>
