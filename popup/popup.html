<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartSniper Pro</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <p class="eyebrow">SMARTSNIPER PRO</p>
        <h1>Deal Desk</h1>
      </div>
      <button id="btn-sync" class="btn primary" type="button">Controlla Ora</button>
    </header>
    <p id="sync-meta" class="sync-meta">Sync: —</p>
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="deals" type="button">Hot Deals</button>
      <button class="tab" data-tab="coupons" type="button">Coupon Live</button>
      <button class="tab" data-tab="settings" type="button">Settings</button>
    </nav>
    <section id="tab-deals" class="panel active">
      <div id="deals-list" class="cards"></div>
    </section>
    <section id="tab-coupons" class="panel" hidden>
      <div id="coupons-summary" class="summary"></div>
      <div id="coupons-list" class="cards"></div>
    </section>
    <section id="tab-settings" class="panel" hidden>
      <form id="settings-form" class="settings-form">
        <label>API mode
          <select id="apiMode">
            <option value="mock">Mock / deals-feed.json</option>
            <option value="live">Live API</option>
          </select>
        </label>
        <label>Poll minuti
          <input id="pollMinutes" type="number" min="1" max="120" step="1" />
        </label>
        <label>SubID default
          <input id="defaultSubId" type="text" maxlength="64" />
        </label>
        <label>Amazon tag
          <input id="amazonTag" type="text" />
        </label>
        <label>Awin publisher
          <input id="awinPublisherId" type="text" />
        </label>
        <label>eBay campaign
          <input id="ebayCampaignId" type="text" />
        </label>
        <label>Min ROI %
          <input id="minRoiPercent" type="number" min="1" max="100" step="1" />
        </label>
        <button class="btn primary" type="submit">Salva</button>
        <p id="settings-msg" class="msg"></p>
      </form>
    </section>
  </div>
  <script src="../utils/affiliate.js"></script>
  <script src="../utils/api-client.js"></script>
  <script src="popup.js"></script>
</body>
</html>
