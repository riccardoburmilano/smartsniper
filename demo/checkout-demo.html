<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartSniper Demo — Checkout</title>
  <style>
    :root {
      --bg: #0e131a;
      --card: #171e28;
      --line: rgba(255, 255, 255, 0.08);
      --text: #e8eef7;
      --muted: #93a1b2;
      --accent: #00d4aa;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Helvetica, Arial, sans-serif;
      background:
        radial-gradient(800px 360px at 100% 0%, rgba(0, 212, 170, 0.12), transparent 50%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 20px 80px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    .eyebrow { color: var(--accent); letter-spacing: 0.12em; font-size: 12px; font-weight: 700; }
    h1 { margin: 8px 0 6px; font-size: 30px; }
    .sub { color: var(--muted); margin: 0 0 22px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
    }
    .line {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      font-size: 14px;
    }
    .total { font-size: 22px; font-weight: 800; color: var(--accent); }
    label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 6px; }
    input {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: #0c1118;
      color: var(--text);
      padding: 10px 12px;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 10px;
      padding: 11px 14px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(180deg, #1dffc2, #00d4aa);
      color: #04110d;
      margin-top: 10px;
    }
    #coupon-status { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 18px; }
    #coupon-status.ok { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">CHECKOUT DEMO · SMARTSNIPER PRO</p>
    <h1>Carrello demo</h1>
    <p class="sub">Apri questa pagina con l’estensione attiva: compare l’overlay Shadow DOM e puoi Auto-Apply.</p>

    <section class="card">
      <div class="line"><span>Sony WH-1000XM5</span><span id="subtotal">€278.00</span></div>
      <div class="line"><span>Spedizione</span><span id="shipping">€4.90</span></div>
      <div class="line"><span>Sconto coupon</span><span id="discount">€0.00</span></div>
      <hr style="border:0;border-top:1px solid var(--line);margin:14px 0;" />
      <div class="line total"><span>Totale</span><span id="total">€282.90</span></div>

      <form id="coupon-form" action="#" method="get">
        <label for="coupon-code">Codice coupon</label>
        <input id="coupon-code" name="coupon" data-ss-coupon type="text" placeholder="Inserisci codice" autocomplete="off" />
        <button id="apply-coupon" data-ss-apply-coupon type="submit">Applica coupon</button>
      </form>
      <p id="coupon-status"></p>
    </section>
  </div>

  <script>
    (function () {
      var SUBTOTAL = 278;
      var SHIPPING = 4.9;
      var applied = null;

      var COUPONS = {
        SNIPER25: { type: "percent", value: 25 },
        SNIPER10: { type: "percent", value: 10 },
        SHIPFREE: { type: "shipping", value: 0 }
      };

      function money(n) {
        return "€" + Number(n).toFixed(2);
      }

      function render() {
        var discount = 0;
        var shipping = SHIPPING;
        if (applied) {
          if (applied.type === "percent") discount = SUBTOTAL * (applied.value / 100);
          if (applied.type === "shipping") shipping = 0;
        }
        var total = SUBTOTAL - discount + shipping;
        document.getElementById("discount").textContent = money(discount);
        document.getElementById("shipping").textContent = money(shipping);
        document.getElementById("total").textContent = money(total);
      }

      document.getElementById("coupon-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var code = String(document.getElementById("coupon-code").value || "").trim().toUpperCase();
        var status = document.getElementById("coupon-status");
        if (!COUPONS[code]) {
          applied = null;
          status.textContent = "Coupon non valido";
          status.className = "";
          render();
          return;
        }
        applied = COUPONS[code];
        status.textContent = "Coupon " + code + " applicato";
        status.className = "ok";
        render();
      });

      render();
    })();
  </script>
</body>
</html>
