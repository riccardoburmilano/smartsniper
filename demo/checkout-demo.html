<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartSniper Demo — Checkout</title>
  <style>
    body{margin:0;font-family:Segoe UI,Helvetica,Arial,sans-serif;background:#0e131a;color:#e8eef7;padding:32px 20px 80px}
    .wrap{max-width:720px;margin:0 auto}
    .eyebrow{color:#00d4aa;letter-spacing:.12em;font-size:12px;font-weight:700}
    h1{margin:8px 0 6px;font-size:28px}
    .card{background:#171e28;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px;margin-bottom:14px}
    .line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
    .line:last-child{border-bottom:0;font-weight:700}
    label{display:block;font-size:12px;color:#93a1b2;margin-bottom:6px}
    input{width:100%;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:#0c1118;color:#e8eef7;padding:10px 12px;margin-bottom:10px}
    #apply-promo,.apply-promo{appearance:none;border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;background:linear-gradient(180deg,#1dffc2,#00d4aa);color:#04110d}
    #promo-feedback{min-height:18px;font-size:13px;color:#93a1b2;margin-top:8px}
    #promo-feedback.ok{color:#00d4aa}#promo-feedback.err{color:#ff6b6b}
  </style>
</head>
<body data-ss-checkout-demo="1">
  <div class="wrap">
    <p class="eyebrow">CHECKOUT DEMO</p>
    <h1>Carrello SmartSniper</h1>
    <section class="card">
      <div class="line"><span>Sony WH-1000XM5</span><span>€248.00</span></div>
      <div class="line"><span>Spedizione</span><span>€4.90</span></div>
      <div class="line"><span>Sconto promo</span><span id="discount-amount">€0.00</span></div>
      <div class="line"><span>Totale</span><span id="order-total" class="order-total" data-ss-order-total>€252.90</span></div>
    </section>
    <section class="card">
      <form id="promo-form" action="#" method="post">
        <label for="promo-code">Codice promozionale</label>
        <input id="promo-code" name="promoCode" data-ss-coupon-input type="text" placeholder="SNIPER25" autocomplete="off" />
        <button id="apply-promo" class="apply-promo" data-ss-coupon-apply type="submit">Applica codice</button>
        <div id="promo-feedback">Validi: SNIPER25, SNIPER10, FLAT15</div>
      </form>
    </section>
  </div>
  <script>
    (function () {
      var BASE_SUBTOTAL = 248;
      var BASE_SHIP = 4.9;
      var discountEl = document.getElementById("discount-amount");
      var totalEl = document.getElementById("order-total");
      var feedback = document.getElementById("promo-feedback");
      var input = document.getElementById("promo-code");
      var RULES = {
        SNIPER25: { type: "percent", value: 25 },
        SNIPER10: { type: "percent", value: 10 },
        FLAT15: { type: "fixed", value: 15 },
        DEADCODE: { type: "percent", value: 0 }
      };
      function round2(n) { return Math.round(n * 100) / 100; }
      function compute(code) {
        var rule = RULES[String(code || "").trim().toUpperCase()];
        var discount = 0;
        if (rule) {
          if (rule.type === "percent") discount = BASE_SUBTOTAL * (rule.value / 100);
          if (rule.type === "fixed") discount = rule.value;
        }
        discount = round2(Math.min(discount, BASE_SUBTOTAL));
        return {
          code: String(code || "").trim().toUpperCase(),
          valid: !!rule && discount > 0,
          discount: discount,
          total: round2(BASE_SUBTOTAL + BASE_SHIP - discount),
          baseline: round2(BASE_SUBTOTAL + BASE_SHIP)
        };
      }
      function paint(result) {
        discountEl.textContent = "€" + result.discount.toFixed(2);
        totalEl.textContent = "€" + result.total.toFixed(2);
        if (!result.code) { feedback.textContent = "Inserisci un codice."; feedback.className = ""; return; }
        if (result.valid) {
          feedback.textContent = "Applicato " + result.code + " (−€" + result.discount.toFixed(2) + ")";
          feedback.className = "ok";
        } else {
          feedback.textContent = "Codice non valido o senza sconto.";
          feedback.className = "err";
        }
      }
      window.__SS_DEMO_EVAL__ = function (code) {
        var result = compute(code);
        input.value = result.code;
        paint(result);
        return result;
      };
      document.getElementById("promo-form").addEventListener("submit", function (ev) {
        ev.preventDefault();
        paint(compute(input.value));
      });
      paint(compute(""));
    })();
  </script>
</body>
</html>
