<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartSniper Demo — Product</title>
  <meta itemprop="price" content="248" />
  <meta property="product:price:amount" content="248" />
  <style>
    body{margin:0;font-family:Segoe UI,Helvetica,Arial,sans-serif;background:#0e131a;color:#e8eef7;padding:32px 20px}
    .wrap{max-width:860px;margin:0 auto}
    .eyebrow{color:#00d4aa;letter-spacing:.12em;font-size:12px;font-weight:700}
    h1{margin:8px 0 6px;font-size:30px}
    .card{background:#171e28;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px;margin-bottom:14px}
    #product-price{font-size:40px;font-weight:800;color:#00d4aa}
    .was{color:#93a1b2;text-decoration:line-through;margin-left:10px}
    label{display:block;font-size:12px;color:#93a1b2;margin-bottom:6px}
    input{width:100%;max-width:240px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:#0c1118;color:#e8eef7;padding:10px 12px;margin-bottom:12px}
    button{appearance:none;border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer;background:linear-gradient(180deg,#1dffc2,#00d4aa);color:#04110d}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{text-align:left;padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.08)}
    th{color:#93a1b2}
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">PRODUCT DEMO</p>
    <h1 id="product-title">Sony WH-1000XM5 Noise Cancelling</h1>
    <div class="card">
      <span id="product-price" data-ss-price data-price="248">€248.00</span>
      <span class="was">€379.00</span>
      <p>FMV eBay/Vinted: <strong>€410</strong> · inbound €0 · outbound €6.50</p>
      <label for="price-input">Simula prezzo</label>
      <input id="price-input" type="number" min="1" step="0.01" value="248" />
      <button id="update-price" type="button">Aggiorna prezzo</button>
    </div>
    <div class="card">
      <h2 style="margin:0 0 10px;font-size:16px">Storico</h2>
      <table>
        <thead><tr><th>Data</th><th>Prezzo</th></tr></thead>
        <tbody id="history-body">
          <tr><td>2026-07-01</td><td>€379.00</td></tr>
          <tr><td>2026-07-15</td><td>€329.00</td></tr>
          <tr><td>2026-08-01</td><td>€279.00</td></tr>
          <tr><td>2026-08-12</td><td>€248.00</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <script>
    (function () {
      var priceEl = document.getElementById("product-price");
      var input = document.getElementById("price-input");
      var historyBody = document.getElementById("history-body");
      document.getElementById("update-price").addEventListener("click", function () {
        var value = Number(input.value);
        if (!Number.isFinite(value) || value <= 0) return;
        var formatted = "€" + value.toFixed(2);
        priceEl.textContent = formatted;
        priceEl.setAttribute("data-price", String(value));
        var m1 = document.querySelector('meta[itemprop="price"]');
        var m2 = document.querySelector('meta[property="product:price:amount"]');
        if (m1) m1.setAttribute("content", String(value));
        if (m2) m2.setAttribute("content", String(value));
        var tr = document.createElement("tr");
        tr.innerHTML = "<td>" + new Date().toISOString().slice(0, 10) + "</td><td>" + formatted + "</td>";
        historyBody.appendChild(tr);
      });
    })();
  </script>
</body>
</html>
